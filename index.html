  }
  .f-p0 {}
  .f-p1 {}
  .f-p2 {}
  .f-p3 {}
  /* app bar */
  /* bid progress blocks + bid panel */
  /* tricks + player cards */
  /* scoreboard: solid header row, colour-blocked rows */
  /* settings, nav, dialogs */
  /* ===================== THEMED CAROUSEL / TOASTS / DIALOGS ===================== */
  .wf-well, .wf-suit { position: absolute; pointer-events: none; }

  .wf-well { left: 22%; right: 22%; top: 24%; bottom: 24%; border-radius: .7rem; box-shadow: var(--n-inset-s); }
  html[data-style="neu"] .rcard.sel .wf-neu { background: var(--bg); color: var(--accent); box-shadow: var(--n-inset-s); }
  html[data-style="neu"] .rcard.sel .wf-neu .wf-suit { color: var(--accent); }
  /* toasts */
  html[data-style="neu"] .n-toast { gap: .5rem; padding: .8rem 1.1rem; }
  html[data-style="neu"] .n-toast .n-led, html[data-style="neu"] .n-modal > .n-led { background: var(--n-led); box-shadow: 0 0 .5rem var(--n-led); }

  /* ===================== TAP TARGETS ON NARROW PHONES ===================== */

  }
  @media (prefers-reduced-motion: reduce) {
    .pop, .view-enter, .view-enter-l, .overlay.out .sheet, .chip.pulse, .trophy, .final-card, .f-label, .f-name, .f-score, .final .primary,
    .stage-enter .player, .stage-enter .turn, .stage-enter .done-card,
    .anim tbody tr, .anim-total tfoot td, .anim-total .t-row, .f-list .t-row, .overlay .sheet { animation: none !important; }
    .toast { animation: toastFade 1.2s ease both; transform: translateX(-50%); }
    .toast circle, .toast path { animation: none; stroke-dashoffset: 0; }
    button { transition: none; }
    .shine.go::after, .rr-row, .final-card.reveal .primary, .final-card.reveal .trophy, .dim, .spot, .final.revealed .dim, .f-list .t-row.tense .t-total { animation: none !important; }
    .toast.rr { animation: toastFade 1.8s ease both; transform: translateX(-50%); }
    .final-card.reveal .f-name, .final-card.reveal .f-score { opacity: 1; filter: none; transform: none; }
    .roll-up, .roll-down, .slide-next, .slide-prev, .sealed, .lock-anim .shackle, .lock-anim .ring, .dots-in, .confirm-ok, .chip-pop,
    .tm-card, .tm-count b, .tcount.okburst, .tcount.okburst .tok path, .tcount.bad, .wcard.flash-bad, .chip.pulse,
    .stage-enter .bidcard, .stage-enter .tcount, .stage-enter .donebar, .rcard.pulse .rc-face, .rcard.nope .rc-face, .wp-card { animation: none !important; }
  }

  /* ===== Primary action buttons: Confirm (#bidConfirm) and Enter Won Tricks (#action), theme-aware ===== */
  html[data-style="neu"][data-theme] :is(#bidConfirm, #action) {
    color: #ffffff; text-shadow: none;
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease, filter .2s ease, opacity .2s ease;
  }
  html[data-style="neu"][data-theme] #action { border: 1px solid transparent; padding: calc(1rem - 1px); }
  html[data-style="neu"][data-theme] #bidConfirm { border: 1px solid transparent; padding: calc(.3rem - 1px); }
  html[data-style="neu"][data-theme] #bidConfirm .n-cap { background: none; color: inherit; transition: none; }
  html[data-style="neu"][data-theme] #bidConfirm .n-led { background: rgba(255, 255, 255, .9); box-shadow: none; }

  html[data-style="neu"][data-theme="light"] :is(#bidConfirm, #action) {
    background: linear-gradient(145deg, #3B82F6, #2563EB);
    border-color: rgba(255, 255, 255, .25);
    box-shadow: 0 8px 18px rgba(37, 99, 235, .22), inset 0 1px 0 rgba(255, 255, 255, .28);
  }
  html[data-style="neu"][data-theme="dark"] :is(#bidConfirm, #action) {

  }
  @media (hover: hover) {
    html[data-style="neu"][data-theme] :is(#bidConfirm, #action):hover:not(:disabled):not(:active) { filter: brightness(1.07); }
  }
  html[data-style="neu"][data-theme="light"] :is(#bidConfirm, #action):active:not(:disabled) {
    box-shadow: 0 3px 8px rgba(37, 99, 235, .22), inset 0 2px 4px rgba(0, 0, 0, .16); transform: scale(.985);
  }
  html[data-style="neu"][data-theme="dark"] :is(#bidConfirm, #action):active:not(:disabled) {
    box-shadow: 0 3px 8px rgba(0, 0, 0, .35), inset 0 2px 4px rgba(0, 0, 0, .3); transform: scale(.985);
  }
  html[data-style="neu"][data-theme] :is(#bidConfirm, #action):disabled { box-shadow: none; }

  /* ===== App-like behaviour: no pinch / double-tap zoom ===== */
  html, body { touch-action: pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html .name-in, html .num { font-size: max(16px, 1rem); } /* iOS zooms into inputs under 16px */

  /* ===== Scoreboard: fit all 4 player columns on narrow phones (no hidden right side) ===== */
  html[data-style="neu"][data-theme] .table-wrap table { table-layout: fixed; width: 100%; }
  html[data-style="neu"][data-theme] .table-wrap :is(th, td) { padding-left: .2rem; padding-right: .2rem; overflow: hidden; text-overflow: ellipsis; max-width: none; }
  html[data-style="neu"][data-theme] .table-wrap :is(th, td):first-child { width: 4.4rem; }
  @media (max-width: 400px) {
    html[data-style="neu"][data-theme] .table-wrap { padding: .5rem; }
    html[data-style="neu"] .table-wrap .n-sheet { padding: .3rem .25rem; }
    html[data-style="neu"][data-theme] .table-wrap :is(th, td):first-child { width: 4.2rem; font-size: .75rem; }
    html[data-style="neu"][data-theme] .table-wrap th, html[data-style="neu"] .table-wrap .n-lbl { font-size: .74rem; letter-spacing: 0; }
    html[data-style="neu"][data-theme] .table-wrap tbody td, html[data-style="neu"][data-theme] .table-wrap tfoot td { font-size: 1.02rem; }
  }
  @media (max-width: 340px) {
    html[data-style="neu"][data-theme] .table-wrap th, html[data-style="neu"] .table-wrap .n-lbl { font-size: .62rem; }
    html[data-style="neu"][data-theme] .table-wrap :is(th, td):first-child { width: 3.9rem; font-size: .7rem; }
  }

  /* ===== Keep everything inside the visible screen width (no cut-off right side) ===== */
  html { overflow-x: hidden; overflow-x: clip; max-width: var(--app-w, 100%); }
  body { overflow-x: hidden; overflow-x: clip; max-width: var(--app-w, 100%); margin-left: 0; margin-right: 0; }
  .app { width: 100%; max-width: min(32.5rem, var(--app-w, 100vw)); overflow-x: clip; }
  .bnav, .overlay, .deal, .final, .confetti, .tmodal, .wbig, .wpeek { width: var(--app-w, auto); max-width: 100%; }
  .confetti { width: var(--app-w, 100%); }
  .toast { left: calc(var(--app-w, 100%) / 2); }
</style>
</head>
<body>
<main class="app">
  <header>

<div class="overlay" id="overlay" hidden>
  <div class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="setTitle">

<script>
(function () {
  var KEY = "callbreak-v4";
  var MIN_BID = 1, MAX_BID = 8, MAX_ROUNDS = 20, HIST_MAX = 10;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function blankCell() { return { bid: 0, won: 0, bidLocked: false, blindBid: false, manual: "", neg: false }; }
  function blankRound() { return { done: false, phase: "bid", view: 0, turn: 0, mode: "auto", cells: [blankCell(), blankCell(), blankCell(), blankCell()] }; }
  function freshState(names, blind, auto, n) {
    var rs = [];
    for (var i = 0; i < (n || 5); i++) rs.push(blankRound());
    return { id: uid(), names: names || ["", "", "", ""], rounds: rs, current: 0, blind: !!blind, auto: auto !== false, sbUnlocked: false, namesOpen: true };
  }
  function norm(st) {
    if (!st || !Array.isArray(st.names) || !Array.isArray(st.rounds) || !st.rounds.length) return null;
    while (st.names.length < 4) st.names.push("");
    st.rounds.forEach(function (r) {
      if (!Array.isArray(r.cells) || r.cells.length !== 4) r.cells = [blankCell(), blankCell(), blankCell(), blankCell()];
      r.mode = r.mode || "auto"; r.turn = r.turn || 0; r.phase = r.phase || "bid";
      r.view = Math.max(0, Math.min(3, r.view || 0));
      r.cells.forEach(function (c, ci) {
        if (typeof c.manual !== "string") c.manual = "";
        if (typeof c.neg !== "boolean") c.neg = false;
        c.bid = c.bid || 0; c.won = c.won || 0;
        c.won = Math.max(0, Math.min(13, c.won));
        if (typeof c.bidLocked !== "boolean") c.bidLocked = !!(r.done || r.phase === "won" || (st.blind && ci < r.turn));
        if (typeof c.blindBid !== "boolean") c.blindBid = !!(st.blind && c.bidLocked);
      });
    });
    st.auto = true; st.blind = !!st.blind; st.sbUnlocked = !!st.sbUnlocked; st.namesOpen = st.namesOpen !== false;
    st.id = st.id || uid();
    st.showTotal = !!st.showTotal;
    st.current = Math.max(0, Math.min(st.current || 0, st.rounds.length - 1));
    for (var oi = 0; oi < st.rounds.length; oi++) if (!st.rounds[oi].done) { st.current = oi; break; }
    return st;
  }

  var state = freshState();
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) { var n0 = norm(JSON.parse(saved)); if (n0) state = n0; }
  } catch (e) {}
  var theme = "dark", font = "m";
  try { theme = localStorage.getItem(KEY + "-theme") || "dark"; font = localStorage.getItem(KEY + "-font") || "m"; if (font === "xl") font = "l"; } catch (e) {}
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.setAttribute("data-font", font);

  var tab = "game";
  var pendingBid = 1;
  var armed = null, armTimer = null;
  var sheetView = "main";
  var saveMsg = "", saveTimer = null;
  var soundOn = true;
  try { soundOn = localStorage.getItem(KEY + "-sound") !== "off"; } catch (e) {}
  var pulseChip = -1, lastStageKey = null;
  var reviewing = false, bidDir = null, numAnim = null, sealAnim = false, totDir = null, totOk = false;

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function nmOf(st, p) { return (st.names[p] || "").trim() || "Player " + (p + 1); }
  function nm(p) { return nmOf(state, p); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function cur() { return state.rounds[state.current]; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---- scoring (kept in tenths so 3.1 never becomes 3.0999) ----
  function manualScore(c) {
    var m = parseFloat(c.manual);
    if (isNaN(m)) return null;
    var t = Math.round(m * 10);
    return c.neg && t !== 0 ? -t : t;
  }
  function autoScore(c) {
    if (!c.bid) return null;
    return c.won >= c.bid ? c.bid * 10 + (c.won - c.bid) : -c.bid * 10;
  }
  function cellScore(st, r, c) {
    var mode = r.done ? (r.mode || "auto") : (st.auto ? "auto" : "manual");
    return mode === "manual" ? manualScore(c) : autoScore(c);
  }
  function totalsOf(st) {
    return [0, 1, 2, 3].map(function (p) {
      return st.rounds.reduce(function (s, r) {
        if (!r.done) return s;
        var t = cellScore(st, r, r.cells[p]);
        return s + (t === null ? 0 : t);
      }, 0);
    });
  }
  function completeOf(st) { return st.rounds.every(function (r) { return r.done; }); }
  function complete() { return completeOf(state); }
  function fmt(t) { if (t === null) return "·"; return t % 10 === 0 ? String(t / 10) : (t / 10).toFixed(1); }
  function cls(t) { return t === null ? "none" : t < 0 ? "neg" : "pos"; }
  function allBid(r) { return r.cells.every(function (c) { return c.bid >= MIN_BID; }); }
  function allManual(r) { return r.cells.every(function (c) { return manualScore(c) !== null; }); }

  function openIdx() { for (var i = 0; i < state.rounds.length; i++) if (!state.rounds[i].done) return i; return -1; }
  function sumWon(r) { return r.cells.reduce(function (a, c) { return a + c.won; }, 0); }
  function lockedCount(r) { return r.cells.filter(function (c) { return c.bidLocked; }).length; }
  function allLocked(r) { return lockedCount(r) === 4; }
  function stage() {
    if (!state.auto) return "manual";
    var r = cur();
    if (complete() && !reviewing) return "complete";
    if (r.done) return "review";
    return r.phase === "won" ? "won" : "bid";
  }
  function canSeeScores() { return !state.blind || state.sbUnlocked; }

  // ---- history ----
  function loadHist() { try { var h = JSON.parse(localStorage.getItem(KEY + "-hist") || "[]"); return Array.isArray(h) ? h : []; } catch (e) { return []; } }
  function storeHist(h) { try { localStorage.setItem(KEY + "-hist", JSON.stringify(h)); } catch (e) {} }
  function hasProgress() { return state.rounds.some(function (r) { return r.done; }); }
  function saveToHistory() {
    var h = loadHist().filter(function (x) { return x.id !== state.id; });
    h.unshift({ id: state.id, savedAt: Date.now(), state: JSON.parse(JSON.stringify(state)) });
    storeHist(h.slice(0, HIST_MAX));
  }

  var $ = function (id) { return document.getElementById(id); };

  function renderNames() {
    var h = "";
    for (var p = 0; p < 4; p++) {
      h += '<input class="name-in" data-p="' + p + '" value="' + esc(state.names[p]) + '" placeholder="Player ' + (p + 1) + '" maxlength="14" aria-label="Player ' + (p + 1) + ' name" autocomplete="off">';
    }
    $("names").innerHTML = h;
  }
  function renderFold() {
    $("fold").setAttribute("aria-expanded", state.namesOpen ? "true" : "false");
    $("names").hidden = !state.namesOpen;
    $("sum").textContent = state.namesOpen ? "" : [0, 1, 2, 3].map(nm).join(", ");
  }

  function renderChips() {

    bigEl.classList.remove("out"); bigEl.hidden = false; bigOpen = true;
    animateIk(1, 340);
    if (!held) { try { bigEl.querySelector(".wbig-close").focus({ preventScroll: true }); } catch (e) {} }
  }
  function closeBig() {
    if (!bigOpen) return;
    bigOpen = false;
    bigEl.classList.add("out");
    animateIk(0, 240);
    bigEl._t = setTimeout(function () { bigEl.hidden = true; bigEl.classList.remove("out"); }, 260);
  }

  // ---- quick 3D preview of a finished round ----
  function hidePeek(now) {
    var el = peekEl;
    if (!el) return;
    peekEl = null; el.id = "";
    if (now) { if (el.parentNode) el.parentNode.removeChild(el); return; }
    el.classList.add("out");
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
  }
  function showPeek(i, sticky) {
    hidePeek(true);
    var r = state.rounds[i], see = canSeeScores(), rows = "";
    r.cells.forEach(function (c, p) {
      var sc = see ? cellScore(state, r, c) : null;
      rows += '<div class="wp-row"><span>' + esc(nm(p)) + "</span><span>" + (c.blindBid ? LOCK_SVG : c.bid) + "</span><span>" + c.won +
        '</span><span class="' + cls(sc) + '">' + (sc === null ? "–" : fmt(sc)) + "</span></div>";
    });
    peekEl = document.createElement("div");
    peekEl.id = "wpeek"; peekEl.className = "wpeek" + (sticky ? " sticky" : ""); peekEl.setAttribute("role", sticky ? "dialog" : "status");
    peekEl.innerHTML = '<div class="wp-card glass shine go"><div class="wp-h"><span>Round ' + (i + 1) + '</span><span class="wp-ok">✓ Complete</span></div>' +
      '<div class="wp-cols"><span></span><span>Bid</span><span>Won</span><span>Pts</span></div>' + rows + (sticky ? '<button class="primary wp-close" type="button">Close</button>' : "") + "</div>";
    document.body.appendChild(peekEl);
    if (sticky) {
      var pe = peekEl;
      pe.addEventListener("click", function (e) { if (e.target === pe || e.target.closest(".wp-close")) hidePeek(); });
      dragDismiss(pe.querySelector(".wp-card"), pe, hidePeek);
    }
  }

  // ---- wheel gestures (Pointer Events) ----
  function detachG() {
    window.removeEventListener("pointermove", gestureMove);
    window.removeEventListener("pointerup", gestureUp);
    window.removeEventListener("pointercancel", gestureCancel);
  }
  function gestureDown(e, w) {
    if (G || SW) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (e.target.closest && e.target.closest(".wexp, .wbig-close")) return;
    var card = e.target.closest && e.target.closest(".rcard");
    var now = performance.now();
    cancelAnimationFrame(w.raf); clearTimeout(retT);
    G = { id: e.pointerId, wheel: w, x0: e.clientX, y0: e.clientY, x: e.clientX, pos0: w.pos, mode: "pending",
          idx: card ? +card.getAttribute("data-r") : -1, vel: 0, lastX: e.clientX, lastT: now };
    G.timer = setTimeout(gestureLong, 450);
    window.addEventListener("pointermove", gestureMove, { passive: true });
    window.addEventListener("pointerup", gestureUp);
    window.addEventListener("pointercancel", gestureCancel);
  }
  function gestureLong() {
    var g = G;
    if (!g || g.mode !== "pending") return;
    var done = g.idx >= 0 && state.rounds[g.idx] && state.rounds[g.idx].done;
    if (done) { g.mode = "preview"; showPeek(g.idx); buzz(); }
    else if (g.wheel === wheelC) { g.mode = "long"; openBig(true); g.wheel = wheelB; g.pos0 = wheelB.pos; g.x0 = g.x; buzz(); }
    else g.mode = "drag";
  }
  function gestureMove(e) {
    var g = G;
    if (!g || e.pointerId !== g.id) return;
    g.x = e.clientX;
    var dx = g.x - g.x0, dy = e.clientY - g.y0, now = performance.now();
    if (now > g.lastT) { g.vel = (g.x - g.lastX) / (now - g.lastT); g.lastX = g.x; g.lastT = now; }
    if (g.mode === "pending") {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) { clearTimeout(g.timer); g.mode = "drag"; g.x0 = g.x; g.pos0 = g.wheel.pos; }
      else if (g.wheel === wheelB && dy > 70 && dy > Math.abs(dx) * 1.4) { clearTimeout(g.timer); detachG(); G = null; gestureBlockUntil = Date.now() + 350; closeBig(); }
      else if (Math.abs(dy) > 12 && g.wheel !== wheelB) { clearTimeout(g.timer); detachG(); G = null; }
      return;
    }
    if (g.mode === "long") { if (Math.abs(dx) > 6) { g.mode = "drag"; g.x0 = g.x; g.pos0 = g.wheel.pos; } return; }
    if (g.mode === "drag") g.wheel.setPos(g.pos0 - (g.x - g.x0) / g.wheel.cfg.step);
  }
  function gestureUp(e) {
    var g = G;
    if (!g || e.pointerId !== g.id) return;
    clearTimeout(g.timer); detachG(); G = null;
    var w = g.wheel;
    if (g.mode === "preview") { hidePeek(); gestureBlockUntil = Date.now() + 400; return; }
    if (g.mode === "long") { gestureBlockUntil = Date.now() + 400; return; }
    if (g.mode === "drag") {
      gestureBlockUntil = Date.now() + 400;
      var shift = Math.max(-1.5, Math.min(1.5, -g.vel * 140 / w.cfg.step));
      var target = mod(Math.round(w.pos + shift), w.cards.length);
      w.animateTo(target, 420, function () { if (w === wheelC) wheelReturn(); });
    }
  }
  function gestureCancel(e) {
    var g = G;
    if (!g || e.pointerId !== g.id) return;
    clearTimeout(g.timer); detachG(); G = null;
    if (g.mode === "preview") hidePeek();
    else if (g.mode === "drag") g.wheel.animateTo(state.current, 300);
    gestureBlockUntil = Date.now() + 300;
  }

  // ---- swipe left/right between players while bidding ----
  function swipeEnd() {
    window.removeEventListener("pointermove", swipeMove);
    window.removeEventListener("pointerup", swipeUp);
    window.removeEventListener("pointercancel", swipeCancel);
  }
  function swipeDown(e) {
    if (SW || G) return;
    if (stage() !== "bid") return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    SW = { id: e.pointerId, x0: e.clientX, y0: e.clientY, active: false, dx: 0, t0: performance.now(), card: null };
    window.addEventListener("pointermove", swipeMove, { passive: true });
    window.addEventListener("pointerup", swipeUp);
    window.addEventListener("pointercancel", swipeCancel);
  }
  function swipeMove(e) {
    var s = SW;
    if (!s || e.pointerId !== s.id) return;
    var dx = e.clientX - s.x0, dy = e.clientY - s.y0;
    if (!s.active) {
      if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        s.active = true; s.card = $("stage").querySelector(".bidcard");
        if (s.card) s.card.classList.add("swiping");
      } else return;
    }
    s.dx = dx;
    var r = cur(), dir = dx < 0 ? 1 : -1, can = r.view + dir >= 0 && r.view + dir <= 3;
    var shift = can ? dx * 0.55 : dx * 0.18;
    if (s.card) { s.card.style.transform = "translateX(" + shift + "px)"; s.card.style.opacity = String(1 - Math.min(Math.abs(shift) / 260, 0.4)); }
  }
  function swipeUp(e) {
    var s = SW;
    if (!s || e.pointerId !== s.id) return;
    swipeEnd(); SW = null;
    if (!s.active) return;
    gestureBlockUntil = Date.now() + 350;
    var r = cur(), dx = s.dx, dir = dx < 0 ? 1 : -1;
    var fast = Math.abs(dx) / Math.max(1, performance.now() - s.t0) > 0.45;
    var go = stage() === "bid" && (Math.abs(dx) > 60 || (Math.abs(dx) > 28 && fast)) && r.view + dir >= 0 && r.view + dir <= 3;
    if (go) { r.view += dir; bidDir = dir > 0 ? "next" : "prev"; save(); renderGame(); }
    else {
      var c = s.card;
      if (c) {
        c.classList.remove("swiping"); c.classList.add("snapback"); c.style.transform = ""; c.style.opacity = "";
        setTimeout(function () { c.classList.remove("snapback"); }, 320);
      }
    }
  }
  function swipeCancel(e) {
    var s = SW;
    if (!s || e.pointerId !== s.id) return;
    swipeEnd(); SW = null;
    if (s.card) { s.card.classList.remove("swiping"); s.card.style.transform = ""; s.card.style.opacity = ""; }
  }
  $("stage").addEventListener("pointerdown", swipeDown);

  // ===== v10: swipe-down to dismiss modals, swipe between Game and Scoreboard =====
  function dragDismiss(panel, zone, close) {
    var d = null;
    function off() {
      window.removeEventListener("pointermove", mv);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", cancel);
    }
    function mv(e) {
      if (!d || e.pointerId !== d.id) return;
      var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      if (!d.on) { if (dy > 10 && dy > Math.abs(dx) * 1.4) { d.on = true; panel.style.transition = "none"; } else return; }
      d.dy = Math.max(0, dy);
      panel.style.transform = "translateY(" + d.dy + "px)";
      panel.style.opacity = String(1 - Math.min(d.dy / 400, 0.5));
    }
    function up(e) {
      if (!d || e.pointerId !== d.id) return;
      var s0 = d; d = null; off();
      if (!s0.on) return;
      gestureBlockUntil = Date.now() + 350;
      var fast = s0.dy / Math.max(1, performance.now() - s0.t0) > 0.5;
      if (s0.dy > 90 || (s0.dy > 40 && fast)) close();
      else {
        panel.style.transition = "transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease";
        panel.style.transform = ""; panel.style.opacity = "";
        setTimeout(function () { panel.style.transition = ""; }, 280);
      }
    }
    function cancel(e) {
      if (!d || e.pointerId !== d.id) return;
      var s0 = d; d = null; off();
      if (s0.on) { panel.style.transition = ""; panel.style.transform = ""; panel.style.opacity = ""; }
    }
    zone.addEventListener("pointerdown", function (e) {
      if (d || (e.pointerType === "mouse" && e.button !== 0)) return;
      if (e.target.closest && e.target.closest("input, textarea, select")) return;
      d = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), on: false, dy: 0 };
      window.addEventListener("pointermove", mv, { passive: true });
      window.addEventListener("pointerup", up);
      window.addEventListener("pointercancel", cancel);
    });
  }
  (function () {   // settings sheet: drag the handle or the title bar down
    var sheet = document.querySelector("#overlay .sheet");
    Array.prototype.forEach.call(sheet.querySelectorAll(".grab, .sheet-head"), function (z) { dragDismiss(sheet, z, closeSettings); });
  })();

  renderNames();
  applyShell();
  renderAll();
})();
</script>

<script>
/* block pinch-zoom and double-tap zoom so the page behaves like a native app */
(function () {
  var stop = function (e) { e.preventDefault(); };
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) { document.addEventListener(n, stop, { passive: false }); });
  document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var last = 0;
  document.addEventListener("touchend", function (e) { var t = Date.now(); if (t - last < 300) e.preventDefault(); last = t; }, { passive: false });
  document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener("keydown", function (e) { if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "0"].indexOf(e.key) >= 0) e.preventDefault(); });
})();
</script>
<script>
/* If the page layout is ever wider than the screen the user can actually see, fit to the visible width */
(function () {
  var root = document.documentElement;
  function fit() {
    var vv = window.visualViewport, vis = vv ? vv.width : 0, lay = root.clientWidth, scr = window.screen && window.screen.width;
    var w = lay;
    if (vis && vis < w - 1) w = vis;
    if (scr && scr > 0 && scr < w - 1 && window.matchMedia("(orientation: portrait)").matches) w = scr;
    if (w < lay - 1) root.style.setProperty("--app-w", Math.floor(w) + "px"); else root.style.removeProperty("--app-w");
    if (window.scrollX) window.scrollTo(0, window.scrollY);
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  setInterval(function () { if (root.scrollWidth > root.clientWidth + 1 || window.scrollX) fit(); }, 600);
})();
  
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => {
        console.log("Service Worker registered successfully!");
      })
      .catch((error) => {
        console.error("Service Worker registration failed:", error);
      });
  });
}
  
</script>
